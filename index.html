<style>
:root {
  --bg: #000;
  --surface: #0f0f10;
  --line: rgba(255,255,255,.09);
  --text: #F5F3EF;
  --muted: #8A8A8A;
  --accent: #C9A961;
  --ease: cubic-bezier(.22,1,.36,1);
  --danger: #E5484D;
  --ok: #30A46C;
  --warn: #F5A623;
  --phil-bg: #F5F3EF;
  --phil-text: #0A0A0A;
  --phil-em: #A88B45;
  --phil-muted: #4A4A4A;
  --font-title: 'Plus Jakarta Sans', sans-serif;
  --font-body: 'Inter', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:400;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{max-width:100%;display:block;-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;user-drag:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
em{font-family:var(--font-title);font-style:normal;font-weight:800;color:var(--accent)}

p, .lead, .desc, .philosophy p, .tech-value, .categoria-intro p, .cover-extra-resena, .projReview { text-align: justify; text-justify: inter-word; }
h1, h2, h3, h4, .eyebrow, .label, .meta, .btn, .mq-item, .tab, .a-btn, button, input, textarea, select { text-align: left; }

nav.top{position:fixed;top:0;left:0;right:0;z-index:9999;padding:14px 0;transition:padding .35s var(--ease),background .35s var(--ease),border-color .35s var(--ease),box-shadow .35s;border-bottom:1px solid transparent;background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent)}
nav.top.scrolled{padding:10px 0;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom-color:var(--line);box-shadow:0 4px 30px rgba(0,0,0,0.5)}
.nav-inner{max-width:1400px;margin:0 auto;padding:0 clamp(14px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{display:flex;align-items:center;cursor:pointer;user-select:none;padding:4px 0;flex-shrink:0}
.logo-img{height:24px;width:auto;display:block;filter:brightness(0) invert(1);-webkit-filter:brightness(0) invert(1)}
.logo-text{font-family:var(--font-title);font-weight:800;font-size:1.15rem;display:none}
.tabs{display:flex;gap:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);position:relative;padding:6px 0;transition:color .3s;white-space:nowrap;flex-shrink:0}
.tab:hover,.tab.active{color:var(--text)}
.tab.active::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:1.5px;background:var(--text)}
.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}

.mobile-menu-btn { display: none; font-size: 24px; color: var(--text); cursor: pointer; padding: 5px; z-index: 10000; }
.mobile-nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9998; display: none; }
.mobile-nav-overlay.active { display: block; }
.mobile-nav { position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: var(--surface); z-index: 9999; padding: 80px 20px 20px; transition: right 0.3s ease; display: flex; flex-direction: column; gap: 20px; border-left: 1px solid var(--line); }
.mobile-nav.active { right: 0; }
.mobile-nav .tab { font-size: 1.1rem; padding: 15px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.mobile-nav .tab.active::after { display: none; }
.mobile-nav .tab.active { color: var(--accent); }
.mobile-close-btn { position: absolute; top: 20px; right: 20px; font-size: 24px; color: var(--muted); cursor: pointer; }

@media (max-width: 900px) {
  .tabs { display: none; }
  .mobile-menu-btn { display: block; }
  .logo-img { height: 20px; }
}

.nav-icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);cursor:pointer;transition:all .3s;position:relative;padding:0;}
.nav-icon-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.nav-icon-btn svg{width:16px;height:16px;fill:currentColor}
.cart-count{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#000;font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;display:none;place-items:center;pointer-events:none;z-index:10;}

.nav-back{display:none;align-items:center;gap:6px;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);transition:.3s;padding:6px 0;white-space:nowrap}
.nav-back.show{display:flex}
.nav-back:hover{color:var(--text)}

main{position:relative}
.view{display:none}.view.active{display:block}

.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;padding:100px 0 80px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1a1a1a,#050505)}
.hero-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero-bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity 2.2s ease-in-out;image-rendering:-webkit-optimize-contrast;image-rendering:high-quality;animation:heroZoomIn 10s linear forwards;animation-play-state:paused;transform-origin:center center;will-change:transform,opacity}
.hero-bg-layer.active{opacity:1;animation-play-state:running}
@keyframes heroZoomIn{from{transform:scale(1)}to{transform:scale(1.1)}}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.6) 50%,rgba(0,0,0,.95));z-index:1;pointer-events:none}
.hero .wrap{position:relative;z-index:2;width:100%;max-width:none;margin:0;padding-left:clamp(24px, 8vw, 120px);padding-right:20px;}
.hero-grid{max-width:820px;margin:0;}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600;margin-bottom:20px}
.eyebrow::before{content:'';width:32px;height:1.5px;background:rgba(255,255,255,.3)}
h1.hero-h1{font-family:var(--font-title);font-weight:800;font-size:clamp(2.2rem,7vw,5.5rem);line-height:1;letter-spacing:-.03em;margin-bottom:24px;white-space:pre-line}
.lead{color:rgba(255,255,255,.75);font-size:clamp(.95rem,1.3vw,1.1rem);max-width:46ch;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border:1px solid var(--line);cursor:pointer;background:none;color:var(--text);transition:.3s}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{background:transparent;color:var(--text)}
.marquee{width:100%;overflow:hidden;border-block:1px solid var(--line);padding:18px 0;display:flex;background:#000;position:relative;z-index:5}
.marquee-inner{display:flex;white-space:nowrap;will-change:transform;animation:marqueeScroll 25s linear infinite;width:max-content}
.marquee:hover .marquee-inner{animation-play-state:paused}
.mq-item{font-family:var(--font-title);font-weight:700;font-size:clamp(1rem,2.5vw,1.8rem);padding:0 24px;display:inline-flex;align-items:center;gap:24px;color:var(--text);letter-spacing:0.02em;text-transform:uppercase}
.mq-item::after{content:'◆';color:var(--accent);font-size:.5em}
@keyframes marqueeScroll{0%{transform:translateX(0%)}100%{transform:translateX(-50%)}}

.featured-section{padding:50px 0;background:#000;border-bottom:1px solid var(--line);overflow:hidden}
.billboard-scroll{width:100%;overflow:hidden;padding:18px 0;position:relative}
.billboard-inner{display:flex;gap:16px;width:max-content;animation:billboardScroll 35s linear infinite}
.billboard-scroll:hover .billboard-inner{animation-play-state:paused}
.billboard-card{flex:0 0 240px;aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.6);border:1px solid var(--line);transition:transform 0.4s var(--ease),border-color 0.4s}
.billboard-card img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s var(--ease)}
.billboard-card:hover{transform:translateY(-6px);border-color:var(--accent)}
.billboard-card:hover img{transform:scale(1.08)}
.billboard-badge{position:absolute;top:8px;right:8px;z-index:2;width:22px;height:22px;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(201,169,97,.35);border-radius:50%;color:var(--accent);transition:transform .3s,background .3s;}
.billboard-card:hover .billboard-badge{transform:scale(1.1);background:rgba(0,0,0,.75)}
.billboard-badge svg{width:11px;height:11px;fill:currentColor;display:block}
@keyframes billboardScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media(max-width:640px){.billboard-card{flex:0 0 180px}.billboard-badge{width:20px;height:20px;top:6px;right:6px}.billboard-badge svg{width:10px;height:10px}}

.plays-banner{background:#08080a;border-bottom:1px solid var(--line);padding:24px 20px;display:flex;justify-content:center;align-items:center;gap:40px;flex-wrap:wrap}
.plays-banner-block{display:flex;align-items:center;gap:12px}
.plays-banner-label{font-family:var(--font-title);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plays-banner-count{font-family:var(--font-title);font-size:clamp(1.5rem,4vw,2.5rem);font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums;}
.plays-banner-icon{width:24px;height:24px;fill:var(--accent);display:inline-block;margin-top:-4px;}

.philosophy{padding:clamp(70px,12vh,160px) 0;background:var(--phil-bg);color:var(--phil-text)}
.phil-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,100px);align-items:start}
@media(max-width:900px){.phil-grid{grid-template-columns:1fr;gap:50px}}
.philosophy h2{font-family:var(--font-title);font-weight:800;font-size:clamp(1.8rem,5vw,3.6rem);line-height:1.05;letter-spacing:-.03em;margin-bottom:20px;color:var(--phil-text)}
.philosophy h2 em{color:var(--phil-em);font-style:normal;}
.philosophy p{color:var(--phil-muted);max-width:56ch;font-size:1rem;text-align:justify;}
.section-head{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,6vw,90px);align-items:start}
@media(max-width:640px){.section-head{grid-template-columns:1fr;gap:16px}}
.label{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:#8A8A8A;font-weight:600;padding-top:.5em;white-space:nowrap}

.tech-sheet{background:#09090a;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:clamp(24px,4vw,40px);color:#fff;box-shadow:0 20px 40px rgba(0,0,0,0.1)}
.tech-title{font-family:var(--font-title); color:var(--accent); font-size:1.1rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:28px; display:flex; align-items:center; gap:10px;}
.tech-row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:0.95rem;gap:20px}
.tech-row:last-child{border-bottom:none;padding-bottom:0}
.tech-label{color:var(--muted);font-weight:400}
.tech-value{color:#fff;font-weight:700;white-space:pre-line;font-family:var(--font-title);line-height:1.3;text-align:right;}

.parallax-row{position:relative;height:100vh;height:100svh;min-height:480px;width:100%;overflow:hidden;display:grid;place-items:center;cursor:pointer;isolation:isolate;background:#000;border-bottom:1px solid rgba(255,255,255,.05)}
.parallax-bg{position:absolute;top:-25%;left:0;width:100%;height:150%;background-size:cover;background-position:center;z-index:0;filter:brightness(.65) saturate(1.05);background-color:#111;will-change:transform}
.parallax-bg.empty{background:linear-gradient(160deg,#111,#050505)}
.parallax-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,.25) 40%,rgba(0,0,0,.8));z-index:1;pointer-events:none}
.parallax-content{position:relative;z-index:2;text-align:center;padding:0 clamp(20px,5vw,64px);max-width:900px;color:#fff}
.parallax-content .num{font-size:.64rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px;display:block}
.parallax-content h2{font-family:var(--font-title);font-weight:800;font-size:clamp(2rem,8vw,7rem);line-height:.98;letter-spacing:-.04em;margin-bottom:18px;color:#fff;text-transform:uppercase}
.parallax-content .cat-logo-img{max-width:min(380px,75vw);max-height:110px;width:auto;height:auto;margin:0 auto 20px;display:block;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 6px 30px rgba(0,0,0,0.7));-webkit-filter:brightness(0) invert(1) drop-shadow(0 6px 30px rgba(0,0,0,0.7));transition:filter .4s,transform .4s}
.parallax-row:hover .cat-logo-img{filter:brightness(0) invert(1) drop-shadow(0 0 30px rgba(255,255,255,0.55)) drop-shadow(0 0 60px rgba(255,255,255,0.2));-webkit-filter:brightness(0) invert(1) drop-shadow(0 0 30px rgba(255,255,255,0.55)) drop-shadow(0 0 60px rgba(255,255,255,0.2));transform:scale(1.04)}
.parallax-content .desc{font-size:clamp(.85rem,1.3vw,1.05rem);color:rgba(255,255,255,.75);max-width:56ch;margin:0 auto 20px}
.parallax-content .meta{display:inline-flex;align-items:center;gap:12px;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
.parallax-content .meta::before,.parallax-content .meta::after{content:'';width:28px;height:1px;background:rgba(255,255,255,.3)}

.proyecto-header{padding:110px 0 30px;background:#000;max-width:1240px;margin:0 auto;padding-inline:clamp(20px,5vw,56px);text-align:center}
.proyecto-header .back-btn{display:inline-flex;align-items:center;gap:10px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:10px 0;margin-bottom:24px}
.proyecto-header .back-btn:hover{color:var(--text)}
.proyecto-logo{max-height:100px;max-width:340px;margin:0 auto 20px;object-fit:contain;filter:brightness(0) invert(1);-webkit-filter:brightness(0) invert(1);transition:filter .3s}
.proyecto-title{font-family:var(--font-title);font-weight:800;font-size:clamp(1.6rem,5vw,3.6rem);line-height:1.05;letter-spacing:-.03em;color:var(--text);text-transform:uppercase}
.proyecto-cat-label{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:12px}

.masonry-gallery{max-width:1400px;margin:30px auto 0;padding:0 clamp(12px,4vw,48px) 70px;column-gap:10px;columns:3}
@media(max-width:900px){.masonry-gallery{columns:2}}
@media(max-width:540px){.masonry-gallery{columns:2;column-gap:6px}}
.masonry-item{break-inside:avoid;margin-bottom:10px;border-radius:4px;overflow:hidden;background:#0a0a0a;cursor:zoom-in;opacity:0;animation:masonryIn .8s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--entry-delay,0s)}
@keyframes masonryIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.masonry-item img{width:100%;height:auto;display:block;min-height:80px;background:#0a0a0a}
.masonry-item.video-item{cursor:default;overflow:hidden;border-radius:2px}
.video-wrapper{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:2px}
.video-wrapper iframe{display:block;width:100%;height:100%;border:0}

.covers-view{padding:110px 0 0;min-height:100vh;background:#000}
.covers-intro{padding:0 clamp(20px,5vw,56px) 30px;max-width:1400px;margin:0 auto}
.covers-intro h1{font-family:var(--font-title);font-weight:800;font-size:clamp(2rem,7vw,5.5rem);line-height:.98;letter-spacing:-.035em;margin-bottom:18px;max-width:20ch;text-transform:uppercase}
.covers-toolbar{max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,56px) 20px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.covers-search-wrap{position:relative;flex:1 1 240px;max-width:440px}
.covers-search-input{width:100%;padding:11px 16px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:100px;color:var(--text);font-size:.85rem;outline:none}
.covers-search-input:focus{border-color:var(--accent)}
.covers-filters{max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,56px) 30px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.covers-filter-btn{padding:8px 16px;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:100px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.covers-filter-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.covers-filter-btn .count{font-size:.7em;opacity:.6;font-weight:500}
.covers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;width:100%;max-width:1600px;margin:0 auto;padding:0 clamp(20px,5vw,56px) 70px}
@media(max-width:900px){.covers-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}}
@media(max-width:540px){.covers-grid{grid-template-columns:repeat(2,1fr);gap:6px;padding:0 12px 60px}}

.cover-item{--cover-glow:rgba(201,169,97,.5);--cover-glow-line:rgba(201,169,97,.45);position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;background:#0a0a0a;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.35);transition:transform .3s ease,box-shadow .5s;perspective:800px;transform-style:preserve-3d;will-change:transform;}
.cover-item img{width:100%;height:100%;object-fit:cover;filter:brightness(.55) saturate(.95);transform:scale(1.06);transition:filter .7s,transform 1s;min-height:80px;pointer-events:none;}
.cover-shine{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 45%,rgba(255,255,255,.08) 50%,transparent 60%);transform:translateX(-120%);transition:transform 1.1s, opacity 0.3s;border-radius:6px;opacity:0;}
.cover-item::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 45%,transparent 75%);opacity:.65;transition:opacity .55s;pointer-events:none;z-index:2}
.cover-item:hover{box-shadow:0 40px 80px -20px var(--cover-glow),0 25px 60px -10px rgba(0,0,0,.85),0 0 0 1.5px var(--cover-glow-line);z-index:20;}
.cover-item:hover img{filter:brightness(1.15) saturate(1.25);transform:scale(1.18)}
.cover-item:hover::after{opacity:1}
.cover-item:hover .cover-shine{opacity:1;transform:translateX(120%)}

.cover-like-btn,.cover-view-badge{opacity:0;transition:opacity .3s ease, transform .25s, background .25s, border-color .25s, color .25s;}
.cover-item:hover .cover-like-btn,.cover-item:hover .cover-view-badge{opacity:1;}
@media (hover: none){.cover-like-btn,.cover-view-badge{opacity:1 !important;}}
.cover-like-btn{position:absolute;bottom:10px;right:10px;z-index:10;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);padding:5px 10px;border-radius:100px;color:#fff;cursor:pointer;transition:transform .25s,background .25s,border-color .25s,color .25s;}
.cover-like-btn:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}
.cover-like-btn.liked{color:#E5484D;border-color:#E5484D}
.cover-like-btn svg{width:13px;height:13px;fill:currentColor;display:block}
.cover-like-btn span{font-size:.68rem;font-weight:700;line-height:1}
.cover-view-badge{position:absolute;bottom:10px;left:10px;z-index:6;display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:700;color:rgba(255,255,255,.88);background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16);padding:5px 9px;border-radius:100px;line-height:1;pointer-events:none;}
.cover-view-badge svg{width:11px;height:11px;fill:currentColor;display:block}
@media(max-width:540px){.cover-like-btn{bottom:7px;right:7px;padding:4px 8px;gap:4px}.cover-like-btn svg{width:12px;height:12px}.cover-like-btn span{font-size:.62rem}.cover-view-badge{bottom:7px;left:7px;padding:4px 7px;font-size:.6rem}.cover-view-badge svg{width:10px;height:10px}}
.cover-music-icon{position:absolute;top:8px;right:8px;z-index:6;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid rgba(201,169,97,.5);display:grid;place-items:center;color:var(--accent);font-size:.8rem;pointer-events:none}
.cover-yt-icon{position:absolute;top:8px;left:8px;z-index:6;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid rgba(255,0,0,.5);display:grid;place-items:center;color:#FF0000;font-size:.65rem;pointer-events:none}

.cover-detail-page{background:#000;min-height:100vh;width:100%}
.cover-hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,110px);align-items:center;width:100%;max-width:1500px;margin:0 auto;padding:100px clamp(20px,5vw,80px) 80px;min-height:100vh;box-sizing:border-box}
@media(max-width:900px){.cover-hero{grid-template-columns:1fr;gap:32px;padding:90px 20px 50px;min-height:auto}}
.cover-hero-image img{width:100%;max-width:540px;aspect-ratio:1/1;object-fit:cover;border-radius:2px;background:#0a0a0a;cursor:zoom-in;margin:0 auto;transition:transform 0.3s ease;will-change:transform;}
.cover-hero-info{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;max-width:600px;margin:0 auto}
.cover-hero-badge{display:inline-flex;align-items:center;padding:8px 18px;border:1.5px solid var(--accent);border-radius:100px;font-size:.65rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:28px}
.cover-hero-title{font-family:var(--font-title);font-weight:800;font-size:clamp(1.8rem,5.4vw,4.6rem);line-height:.94;letter-spacing:-.045em;text-transform:uppercase;color:#fff;margin:0 0 20px 0;word-break:break-word}
.cover-hero-artist{font-size:clamp(.9rem,1.3vw,1.15rem);color:rgba(245,243,239,.85);margin:0 0 24px 0}
.cover-hero-plays { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.play-stat { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--accent); background: rgba(201,169,97,0.06); padding: 8px 16px; border-radius: 100px; font-weight: 700; border: 1px solid rgba(201,169,97,0.2); }
.play-stat svg { width: 16px; height: 16px; fill: var(--accent); }
.cover-hero-music{width:100%;max-width:520px;margin-top:8px;}
.cover-hero-music iframe{border-radius:4px;background:transparent;}
.cover-extra-section{background:#000;width:100%;padding:60px 0 30px}
.cover-extra-section.hidden{display:none}
.cover-extra-block{max-width:1000px;margin:0 auto 40px;padding:0 clamp(20px,5vw,56px)}
.cover-extra-label{font-size:.68rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:24px;display:flex;align-items:center;gap:16px}
.cover-extra-label::before{content:'';width:32px;height:1px;background:var(--line)}
.cover-extra-resena{font-size:clamp(.9rem,1.3vw,1.12rem);font-weight:300;line-height:1.9;color:rgba(245,243,239,.7);white-space:pre-line;max-width:65ch;text-align:justify;}

.software-section{padding:clamp(60px,10vh,110px) 0;background:#000;border-top:1px solid var(--line)}
.software-section h2{color:var(--text);font-family:var(--font-title);font-weight:800;font-size:clamp(1.6rem,4.4vw,3rem);line-height:1.05;letter-spacing:-.03em;margin-bottom:14px;text-transform:uppercase}
.software-section p{color:var(--muted);max-width:56ch;font-size:.95rem}
.software-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:20px 24px;margin-top:40px;align-items:center;}
@media(max-width:640px){.software-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
.software-logo{display:flex;justify-content:center;align-items:center;padding:16px;min-height:80px;width:100%;cursor:pointer;filter:brightness(0) invert(1);-webkit-filter:brightness(0) invert(1);opacity:.75;transition:filter .3s,opacity .3s,transform .3s;}
.software-logo img{max-width:100%;max-height:44px;width:auto;height:auto;object-fit:contain;transition:transform .3s;min-height:16px;margin:0 auto;display:block;}
.software-logo:hover{opacity:1;filter:brightness(0) invert(1) drop-shadow(0 0 16px rgba(255,255,255,0.6));-webkit-filter:brightness(0) invert(1) drop-shadow(0 0 16px rgba(255,255,255,0.6));}
.software-logo:hover img{transform:scale(1.06)}

.clientes-view{padding:120px 0 80px;min-height:100vh;background:#000}
.clientes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:clamp(20px,4vw,50px) clamp(16px,3vw,40px);margin-top:40px;align-items:center}
@media(max-width:640px){.clientes-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(max-width:380px){.clientes-grid{grid-template-columns:1fr}}
.cliente-logo{display:grid;place-items:center;padding:24px;cursor:pointer;min-height:100px;filter:brightness(0) invert(1);-webkit-filter:brightness(0) invert(1);opacity:.75;transition:filter .3s,opacity .3s,transform .3s}
.cliente-logo img{max-width:100%;max-height:70px;width:auto;height:auto;object-fit:contain;transition:transform .3s;min-height:16px}
.cliente-logo:hover{opacity:1;filter:brightness(0) invert(1) drop-shadow(0 0 20px rgba(255,255,255,0.65));-webkit-filter:brightness(0) invert(1) drop-shadow(0 0 20px rgba(255,255,255,0.65))}
.cliente-logo:hover img{transform:scale(1.05)}
@media(max-width:900px){.cliente-logo,.software-logo{filter:brightness(0) invert(1) !important;-webkit-filter:brightness(0) invert(1) !important;}}

.contacto-view{padding:120px 0 60px;min-height:100vh}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);align-items:start}
@media(max-width:880px){.contact-grid{grid-template-columns:1fr;gap:40px}}
.c-item{padding:18px 0;border-top:1px solid var(--line)}
.c-label{font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.c-value{font-family:var(--font-title);font-weight:700;font-size:clamp(1rem,2vw,1.3rem);display:inline-block;word-break:break-word}
.field{margin-bottom:20px}
.field label{display:block;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.field input,.field textarea{width:100%;padding:12px 0;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--text);font-family:var(--font-title);font-size:1.05rem;font-weight:600;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:100px;resize:vertical}
.form-btn{width:100%;padding:16px;background:var(--text);color:var(--bg);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-top:10px;cursor:pointer;font-family:var(--font-title);transition:.3s}
.form-btn:hover{opacity:0.9}

.tienda-view{padding:120px 0 80px;min-height:100vh;background:#000}
.tienda-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:40px;}
.tienda-card{background:#0a0a0a;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:transform .3s; display: flex; flex-direction: column;}
.tienda-card:hover{transform:translateY(-5px);border-color:var(--accent);}
.tienda-card-img-wrap{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:#0a0a0a;}
.tienda-card img{width:100%;height:100%;object-fit:cover;display:block;}
.tienda-card-info{padding:15px; flex: 1; display: flex; flex-direction: column;}
.tienda-card-title{font-family:var(--font-title);font-size:1.1rem;font-weight:700;margin-bottom:5px;}
.tienda-card-price{color:var(--accent);font-weight:800;font-size:1.2rem;margin-bottom:10px;}

.tienda-card-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 15px; cursor: pointer; }
.tienda-card-desc-label { color: var(--text); font-weight: 600; display: block; margin-bottom: 5px; text-decoration: underline; text-decoration-color: var(--line); }
.tienda-card-desc-text { display: none; text-align: justify; margin-top: 5px; }
.tienda-card-desc.open .tienda-card-desc-text { display: block; }

.tienda-qty-wrap { display: flex; gap: 10px; margin-top: auto; }
.tienda-qty-input { width: 60px; padding: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); border-radius: 4px; color: #fff; text-align: center; font-weight: 700; outline: none; }
.tienda-qty-input:focus { border-color: var(--accent); }

.tienda-btn-add{width:100%;padding:10px;background:var(--accent);color:#000;font-weight:700;text-transform:uppercase;font-size:.75rem;letter-spacing:.05em;border:none;cursor:pointer;border-radius:4px;transition:.2s;position:relative;overflow:hidden;}
.tienda-btn-add:hover{background:#fff;}
.tienda-btn-add:active{transform:scale(0.95);}
.tienda-btn-add.pop-anim{animation:btnPop .3s ease;}
@keyframes btnPop{0%{transform:scale(1)}50%{transform:scale(0.92)}100%{transform:scale(1)}}

.tienda-examples-dot {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  color: #111;
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  border: none;
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  transition: transform 0.2s, background 0.2s, opacity 0.2s;
  z-index: 3;
  padding: 0 0 2px 0;
  font-family: var(--font-title);
  opacity: 0.85;
}
.tienda-examples-dot:hover {
  transform: translateX(-50%) scale(1.15);
  background: #fff;
  opacity: 1;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
}
.tienda-examples-dot:active {
  transform: translateX(-50%) scale(0.92);
}

.a-badge.hidden-product{background:var(--danger);color:#fff;border-color:var(--danger)}

.maintenance-banner { background: #111; border: 2px solid var(--danger); border-radius: 12px; padding: 15px; overflow: hidden; margin-bottom: 40px; box-shadow: 0 0 20px rgba(229,72,77,0.4); }
.led-text { font-family: monospace; font-size: 2rem; font-weight: 900; color: var(--danger); white-space: nowrap; animation: scrollLed 8s linear infinite; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 10px var(--danger); }
@keyframes scrollLed { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

.perfil-view { padding: 120px 0 80px; min-height: 100vh; background: #000; }
.perfil-header { display: flex; align-items: center; gap: 24px; margin-bottom: 50px; padding-bottom: 30px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.perfil-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); box-shadow: 0 0 30px rgba(201,169,97,0.2); }
.perfil-info h2 { font-family: var(--font-title); font-size: 2rem; font-weight: 800; margin-bottom: 4px; }
.perfil-info p { color: var(--muted); font-size: 1rem; }
.perfil-logout { margin-left: auto; background: rgba(229,72,77,0.1); color: var(--danger); border: 1px solid rgba(229,72,77,0.2); padding: 10px 20px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
.perfil-logout:hover { background: var(--danger); color: #fff; }
.perfil-section { margin-bottom: 60px; }
.perfil-section-title { font-family: var(--font-title); font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; color: var(--text); display: flex; align-items: center; gap: 10px; }
.perfil-empty { text-align: center; padding: 40px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 1rem; }
.cart-item { display: flex; align-items: center; gap: 20px; background: var(--surface); border: 1px solid var(--line); padding: 16px; border-radius: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.cart-item img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; }
.cart-item-info h4 { font-family: var(--font-title); font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
.cart-item-price { color: var(--accent); font-weight: 700; }
.cart-item-remove { margin-left: auto; color: var(--muted); cursor: pointer; padding: 10px; transition: 0.3s; }
.cart-item-remove:hover { color: var(--danger); }

.cart-editable-toggle { display: flex; align-items: center; gap: 10px; background: rgba(201,169,97,0.05); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(201,169,97,0.2); margin-top: 10px; width: 100%; font-size: 0.85rem; cursor: pointer; transition: 0.3s; }
.cart-editable-toggle:hover { background: rgba(201,169,97,0.1); }
.cart-editable-toggle input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.cart-briefing-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--text); padding: 8px 16px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; width: 100%; text-align: center; }
.cart-briefing-btn:hover { background: rgba(255,255,255,0.1); }
.cart-briefing-btn.pending { background: rgba(245,166,35,0.1); border-color: var(--warn); color: var(--warn); }
.cart-briefing-btn.filled { background: rgba(48,164,108,0.1); border-color: var(--ok); color: var(--ok); }

.cart-checkout { width: 100%; padding: 16px; background: #25D366; color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
.cart-checkout:hover { background: #128C7E; transform: translateY(-2px); }

.order-history-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
.order-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
.order-date { font-family: var(--font-title); font-weight: 700; color: var(--accent); }
.order-total { font-weight: 800; }
.order-products-list { list-style: none; padding-left: 0; }
.order-products-list li { font-size: 0.9rem; color: var(--muted); margin-bottom: 5px; }

#briefingModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
#briefingModal.active { display: flex; }
.briefing-content { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 500px; padding: 30px; max-height: 90vh; overflow-y: auto; position: relative; }
.briefing-content h3 { font-family: var(--font-title); font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
.briefing-field { margin-bottom: 15px; }
.briefing-field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.briefing-field label span { color: var(--danger); }
.briefing-field input, .briefing-field textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: #fff; outline: none; }
.briefing-field input:focus, .briefing-field textarea:focus { border-color: var(--accent); }
.briefing-close { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--muted); font-size: 1.2rem; }

#checkoutModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 10001; display: none; align-items: center; justify-content: center; padding: 20px; }
#checkoutModal.active { display: flex; }
.checkout-content { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 400px; padding: 30px; position: relative; text-align: center; }
.checkout-content h3 { font-family: var(--font-title); font-size: 1.5rem; margin-bottom: 10px; color: var(--text); }
.checkout-content p { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
.checkout-btn-group { display: flex; flex-direction: column; gap: 12px; }
.checkout-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.3s; border: none; }
.checkout-btn.wa { background: #25D366; color: #fff; }
.checkout-btn.wa:hover { background: #128C7E; }
.checkout-btn.em { background: var(--accent); color: #000; }
.checkout-btn.em:hover { background: #e0bd6e; }

#onboardingModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
#onboardingModal.active { display: flex; }
.onboarding-content { background: var(--surface); border: 1px solid var(--accent); border-radius: 16px; width: 100%; max-width: 450px; padding: 30px; position: relative; box-shadow: 0 0 50px rgba(201,169,97,0.2); }
.onboarding-content h2 { font-family: var(--font-title); font-size: 1.5rem; margin-bottom: 10px; text-align: center; color: var(--text); }
.onboarding-content p { font-size: 0.9rem; color: var(--muted); text-align: center; margin-bottom: 24px; }
.onboarding-field { margin-bottom: 20px; }
.onboarding-field label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
.onboarding-field select, .onboarding-field input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--text); outline: none; font-size: 1rem; }
.onboarding-field select:focus, .onboarding-field input:focus { border-color: var(--accent); }

.contact-cta-section {background: var(--phil-bg);color: var(--phil-text);padding: clamp(60px, 12vh, 120px) 0;text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;}
.contact-cta-section h2 {font-family: var(--font-title);font-size: clamp(2.2rem, 6vw, 4.5rem);font-weight: 800;letter-spacing: -0.03em;margin-bottom: 30px; color: var(--phil-text);}
.btn-cta-gold { background: var(--accent); color: #000; border: 1px solid var(--accent); padding: 18px 50px; font-size: 1.1rem; border-radius: 50px; font-family: var(--font-title); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s; cursor: pointer; box-shadow: 0 10px 30px rgba(201,169,97,0.3); }
.btn-cta-gold:hover { background: #e0bd6e; transform: translateY(-3px); box-shadow: 0 15px 40px rgba(201,169,97,0.5); }

.user-dropdown-wrap { position: relative; }
.user-dropdown { position: absolute; top: calc(100% + 10px); right: 0; background: #fff; border-radius: 12px; padding: 8px; width: 200px; z-index: 10000; box-shadow: 0 10px 40px rgba(0,0,0,0.15); opacity: 0; transform: translateY(-10px); visibility: hidden; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.user-dropdown.open { opacity: 1; transform: translateY(0); visibility: visible; }
.user-dropdown a { display: block; padding: 10px 14px; font-size: 0.9rem; color: #000; border-radius: 8px; transition: 0.2s; text-decoration: none; font-weight: 500; text-align: left; }
.user-dropdown a:hover { background: #f0f0f0; }
.user-dropdown a.danger { color: var(--danger); }
.user-dropdown a.danger:hover { background: #FFF0F0; }

footer {border-top: 1px solid var(--line);padding: 50px 0 40px;background: #000;text-align: center;}
.footer-logo {height: 48px;width: auto;margin: 0 auto 24px;display: block;filter: brightness(0) invert(1);-webkit-filter: brightness(0) invert(1);}
.footer-inner {display: flex;justify-content: center;gap: 24px;flex-wrap: wrap;align-items: center;font-size: .66rem;letter-spacing: .14em;text-transform: uppercase;color: var(--muted);font-weight: 500;}
.footer-location {color: var(--muted); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px;}

.lightbox{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.96);display:none;align-items:center;justify-content:center;padding:40px;cursor:zoom-out;backdrop-filter:blur(8px)}
.lightbox.active{display:flex;animation:lbFade .25s ease}
@keyframes lbFade{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 30px 100px rgba(0,0,0,0.9);cursor:default;animation:lbZoom .35s cubic-bezier(.16,1,.3,1)}
@keyframes lbZoom{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.lightbox-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer;transition:.2s;z-index:2}
.lightbox-close:hover{background:rgba(255,255,255,0.22);transform:rotate(90deg)}
@media(max-width:640px){.lightbox{padding:12px}.lightbox-close{top:10px;right:10px;width:38px;height:38px;font-size:16px}}

.public-toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:rgba(20,20,22,.98);border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:99998;opacity:0;transition:.3s;backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:calc(100vw - 32px);text-align:center}
.public-toast.show{transform:translate(-50%,0);opacity:1}
.public-toast.error{border-left:3px solid var(--danger)}

#adminApp{--a-bg:#08080a;--a-surface:#111115;--a-surface-hover:#1a1a20;--a-line:rgba(255,255,255,0.08);--a-text:#F5F3EF;--a-muted:#8A8A8A;--a-accent:#C9A961;--a-accent-hover:#e0bd6e;--a-danger:#E5484D;--a-ok:#30A46C}
#adminApp *{box-sizing:border-box;margin:0;padding:0}
#adminApp{background:var(--a-bg);color:var(--a-text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;display:none}
#adminApp.active{display:block}
.admin-layout{display:flex;min-height:100vh;position:relative}
.a-sidebar{width:280px;background:linear-gradient(180deg,#0d0d10 0%,#0a0a0c 100%);border-right:1px solid var(--a-line);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:1000;transform:translateX(-100%);transition:transform 0.3s cubic-bezier(.22,1,.36,1);box-shadow:5px 0 30px rgba(0,0,0,0.5)}
.a-sidebar.open{transform:translateX(0)}
.a-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(2px);z-index:999;display:none}
.a-overlay.active{display:block}
.a-main{flex:1;display:flex;flex-direction:column;min-height:100vh;background:var(--a-bg);width:100%}
.a-sidebar-header{padding:20px;border-bottom:1px solid var(--a-line);display:flex;justify-content:space-between;align-items:center}
.a-sidebar-logo{height:24px;width:auto;filter:brightness(0) invert(1);-webkit-filter:brightness(0) invert(1)}
.a-sidebar-nav{padding:14px 10px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.a-nav-item{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:500;color:var(--a-muted);display:flex;align-items:center;gap:10px;transition:all 0.2s;cursor:pointer}
.a-nav-item:hover{background:var(--a-surface-hover);color:var(--a-text)}
.a-nav-item.active{background:linear-gradient(135deg,rgba(201,169,97,0.18) 0%,rgba(201,169,97,0.08) 100%);color:var(--a-accent);font-weight:600;box-shadow:inset 3px 0 0 var(--a-accent)}
.a-nav-icon{font-size:16px;line-height:1;width:20px;text-align:center;flex-shrink:0}
.a-nav-label{flex:1}
.a-nav-badge{background:rgba(201,169,97,0.15);color:var(--a-accent);padding:2px 7px;border-radius:100px;font-size:10px;font-weight:700;min-width:20px;text-align:center}
.a-sidebar-footer{padding:14px;border-top:1px solid var(--a-line);display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,0.2)}
.a-sync{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--a-muted);padding:6px 4px}
.a-sync-dot{width:7px;height:7px;border-radius:50%;background:var(--a-ok);box-shadow:0 0 8px var(--a-ok)}
.a-sync.saving .a-sync-dot{background:var(--a-accent);box-shadow:0 0 8px var(--a-accent);animation:pulse 1s infinite}
.a-sync.error .a-sync-dot{background:var(--a-danger);box-shadow:0 0 8px var(--a-danger)}
@keyframes pulse{50%{opacity:0.5}}
.a-topbar{padding:14px 20px;border-bottom:1px solid var(--a-line);display:flex;justify-content:space-between;align-items:center;background:rgba(8,8,10,0.95);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50;width:100%;gap:12px;flex-wrap:wrap}
.a-topbar-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.a-menu-btn{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(201,169,97,0.12),rgba(201,169,97,0.04));border:1px solid rgba(201,169,97,0.25);color:var(--a-accent);padding:8px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.08em;flex-shrink:0}
.a-menu-btn:hover{background:linear-gradient(135deg,rgba(201,169,97,0.25),rgba(201,169,97,0.1))}
.a-page-title{font-family:var(--font-title);font-size:1.25rem;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-topbar-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:640px){.a-topbar{padding:12px 14px}.a-page-title{font-size:1.05rem}.a-topbar-actions .a-btn{padding:6px 10px;font-size:11px}}
.a-content{padding:32px 40px;flex:1;width:100%;}
@media(max-width:640px){.a-content{padding:16px 12px}}
.a-panel{display:none;animation:fadeIn 0.3s ease}
.a-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.a-hero{padding:24px;border-radius:16px;background:linear-gradient(135deg,rgba(201,169,97,0.15) 0%,rgba(201,169,97,0.04) 100%);border:1px solid rgba(201,169,97,0.2);margin-bottom:20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
@media(max-width:640px){.a-hero{padding:18px;gap:12px}.a-hero-icon{font-size:32px}}
.a-hero-icon{font-size:40px;flex-shrink:0;line-height:1}
.a-hero-text{flex:1;min-width:180px}
.a-hero-text h2{font-family:var(--font-title);font-size:1.35rem;font-weight:800;margin-bottom:4px;letter-spacing:-0.02em}
@media(max-width:640px){.a-hero-text h2{font-size:1.15rem}}
.a-hero-text p{color:var(--a-muted);font-size:13px;line-height:1.5}
.a-hero-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.a-stat{background:rgba(0,0,0,0.3);padding:6px 12px;border-radius:8px;border:1px solid var(--a-line);font-size:11px;display:flex;align-items:center;gap:6px}
.a-stat strong{color:var(--a-accent);font-size:13px;font-weight:700}
.a-card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:12px;margin-bottom:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.a-card-header{padding:16px 20px;border-bottom:1px solid var(--a-line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent)}
.a-card-title{font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:0.01em;font-family:var(--font-title)}
.a-card-title-icon{font-size:18px}
.a-card-title .a-count{background:rgba(201,169,97,0.15);color:var(--a-accent);padding:2px 9px;border-radius:100px;font-size:10px;font-weight:700;margin-left:auto}
.a-card-body{padding:20px}
.a-form-group{margin-bottom:18px}
.a-form-group:last-child{margin-bottom:0}
.a-form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--a-muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.a-form-hint{font-size:11px;color:var(--a-muted);margin-top:6px;display:block;line-height:1.5;padding-left:2px}
.a-form-input,.a-form-textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--a-line);border-radius:8px;font-size:13px;color:var(--a-text);outline:none;transition:border 0.2s,background 0.2s}
.a-form-input:focus,.a-form-textarea:focus{border-color:var(--a-accent);background:rgba(255,255,255,0.05)}
.a-form-textarea{min-height:80px;resize:vertical;font-family:'Inter',sans-serif}
.a-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;font-size:12px;font-weight:600;border-radius:8px;transition:all 0.2s;cursor:pointer;white-space:nowrap;letter-spacing:0.01em;font-family:var(--font-title)}
.a-btn-primary{background:linear-gradient(135deg,var(--a-accent) 0%,#b8934e 100%);color:#000;border:1px solid var(--a-accent);box-shadow:0 4px 14px rgba(201,169,97,0.3)}
.a-btn-primary:hover{background:linear-gradient(135deg,var(--a-accent-hover) 0%,var(--a-accent) 100%);transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,169,97,0.4)}
.a-btn-outline{background:rgba(255,255,255,0.03);border:1px solid var(--a-line);color:var(--a-text)}
.a-btn-outline:hover{background:var(--a-surface-hover);border-color:rgba(255,255,255,0.2)}
.a-btn-danger{background:rgba(229,72,77,0.1);color:var(--a-danger);border:1px solid rgba(229,72,77,0.2)}
.a-btn-danger:hover{background:var(--a-danger);color:#fff}
.a-btn-sm{padding:6px 12px;font-size:11px;border-radius:6px}
.a-btn-xs{padding:4px 9px;font-size:10px;border-radius:5px}
.a-btn-block{width:100%}
.a-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
.a-cover-card{background:#000;border:1px solid var(--a-line);border-radius:10px;overflow:hidden;position:relative;transition:transform 0.2s,border-color 0.2s}
.a-cover-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.2)}
.a-cover-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;min-height:60px}
.a-cover-card-info{padding:10px;background:var(--a-surface)}
.a-cover-card-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.a-cover-card-meta{font-size:10px;color:var(--a-muted);margin-bottom:6px}
.a-cover-card-actions{display:flex;gap:4px;margin-top:4px}
.a-cover-card-actions .a-btn{flex:1}
.a-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.85);color:var(--a-accent);font-size:9px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;z-index:2;border:1px solid rgba(201,169,97,0.4)}
.a-badge.featured{background:var(--a-accent);color:#000;border-color:var(--a-accent)}
.a-badge.hidden-product{background:var(--a-danger);color:#fff;border-color:var(--a-danger)}
.upload-zone{border:2px dashed var(--a-line);border-radius:12px;padding:20px 16px;text-align:center;cursor:pointer;transition:all 0.25s;background:rgba(255,255,255,0.01);position:relative}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--a-accent);background:rgba(201,169,97,0.06)}
.upload-zone.dragover{border-style:solid;box-shadow:0 0 0 4px rgba(201,169,97,0.15)}
.upload-zone-icon{font-size:26px;margin-bottom:6px;display:block}
.upload-zone-text{font-size:12px;color:var(--a-muted);line-height:1.5}
.upload-zone-text strong{color:var(--a-text);display:block;margin-bottom:2px;font-size:13px}
.upload-zone.compact{padding:12px;border-radius:10px}
.upload-zone.compact .upload-zone-icon{font-size:18px;margin-bottom:3px}
.upload-zone.compact .upload-zone-text{font-size:10px}
.upload-zone.compact .upload-zone-text strong{font-size:11px}
.divider-or{display:flex;align-items:center;gap:12px;margin:12px 0;color:var(--a-muted);font-size:10px;text-transform:uppercase;letter-spacing:0.12em;font-weight:600}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--a-line)}
.divider-line{height:1px;background:var(--a-line);margin:20px 0}

.cat-card-body,.project-card-body{padding:14px}
.cat-card-title,.project-card-title{font-family:var(--font-title);font-weight:700;font-size:14px;margin-bottom:4px}
.cat-card-meta,.project-card-meta{font-size:11px;color:var(--a-muted)}

.project-image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
.project-image-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid var(--a-line);cursor:pointer;background:#000}
.project-image-item img{width:100%;height:100%;object-fit:cover}
.project-image-item.parallax-selected{border-color:var(--a-accent);box-shadow:0 0 0 2px rgba(201,169,97,0.35)}
.project-image-item.parallax-selected::after{content:'★ PARALLAX';position:absolute;bottom:6px;left:6px;background:var(--a-accent);color:#000;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px}
.project-image-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(229,72,77,0.9);color:#fff;font-size:11px;display:grid;place-items:center;border:none;cursor:pointer}

.a-switch { position: relative; display: inline-block; width: 60px; height: 34px; }
.a-switch input { opacity: 0; width: 0; height: 0; }
.a-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #E5484D; transition: .4s; border-radius: 34px; }
.a-slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .a-slider { background-color: #30A46C; }
input:checked + .a-slider:before { transform: translateX(26px); }

.briefing-editor-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.briefing-editor-row input[type="text"] { flex: 1; padding: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--a-line); border-radius: 6px; color: #fff; }
.briefing-editor-row label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--a-muted); cursor: pointer; white-space: nowrap; }
.briefing-editor-row button { background: rgba(229,72,77,0.2); color: var(--a-danger); border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

.a-login-screen{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;z-index:99999}
.a-login-screen.active{display:flex}
.a-login-card{width:100%;max-width:380px;background:var(--a-surface);border:1px solid var(--a-line);border-radius:12px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.a-login-title{font-family:var(--font-title);font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:16px; color:var(--a-accent);}
.a-login-error{color:var(--a-danger);font-size:12px;text-align:center;margin-top:12px;min-height:18px}

.a-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:99998;padding:20px}
.a-modal-overlay.active{display:flex;animation:fadeIn 0.2s ease}
.a-modal-content{background:var(--a-surface);border:1px solid var(--a-line);border-radius:14px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 30px 80px rgba(0,0,0,0.8);display:flex;flex-direction:column;}
.a-modal-content::-webkit-scrollbar{width:6px}
.a-modal-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
.a-modal-header{padding:16px 20px;border-bottom:1px solid var(--a-line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--a-surface);z-index:10;border-radius:14px 14px 0 0}
.a-modal-title{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:8px;font-family:var(--font-title)}
.a-modal-close{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.05);color:var(--a-muted);cursor:pointer;display:grid;place-items:center;font-size:14px;border:none;transition:.2s}
.a-modal-close:hover{background:rgba(229,72,77,0.15);color:var(--a-danger)}
.a-modal-body{padding:20px;flex:1}
.a-modal-footer{padding:14px 20px;border-top:1px solid var(--a-line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--a-surface);z-index:10;border-radius:0 0 14px 14px;flex-wrap:wrap}

.a-toast-container{position:fixed;bottom:20px;right:16px;z-index:3000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.a-toast{background:var(--a-surface);border:1px solid var(--a-line);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;transform:translateY(100px);opacity:0;transition:all 0.3s;display:flex;align-items:center;gap:10px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,0.5);pointer-events:auto;max-width:calc(100vw - 32px)}
.a-toast.show{transform:translateY(0);opacity:1}
.a-toast.success{border-left:3px solid var(--a-ok)}
.a-toast.error{border-left:3px solid var(--a-danger)}
.cover-preview-row{display:grid;grid-template-columns:100px 1fr;gap:14px;margin-bottom:18px;align-items:start}
@media(max-width:480px){.cover-preview-row{grid-template-columns:1fr}}
.cover-preview-img{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--a-line);background:#000}

.cta-buttons {display: flex;justify-content: center;gap: 40px;flex-wrap: wrap;}
.cta-btn {display: flex;flex-direction: column;align-items: center;gap: 16px;text-decoration: none;color: var(--phil-text);transition: transform 0.3s;}
.cta-btn:hover {transform: translateY(-6px);}
.cta-icon {width: 72px;height: 72px;border-radius: 50%;background: #fff;display: grid;place-items: center;box-shadow: 0 10px 30px rgba(0,0,0,0.08);transition: box-shadow 0.3s;}
.cta-btn:hover .cta-icon {box-shadow: 0 15px 40px rgba(0,0,0,0.15);}
.cta-icon svg {width: 32px;height: 32px;}
.cta-btn.wa .cta-icon svg, .cta-btn.ig .cta-icon svg, .cta-btn.em .cta-icon svg { color: #000; }
.cta-label {font-size: 0.85rem;font-weight: 700;text-transform: uppercase;letter-spacing: 0.15em;color: var(--phil-text);}
</style>
</head>
