<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio | Admin Panel</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #f3f3f3;
            --accent-color: #3b82f6;
            --sidebar-bg: #161616;
            --border-color: #2a2a2a;
            --card-bg: #1a1a1a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
        }
        /* Estilos del Sitio Público */
        #public-view {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            transition: margin-left 0.3s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        h1, h2, h3 { margin: 0 0 10px 0; }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        
        /* Estilos del Panel Admin Profesional */
        #admin-view {
            display: none;
            width: 100%;
            min-height: 100vh;
        }
        .admin-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        .admin-sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            box-sizing: border-box;
        }
        .admin-sidebar h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .admin-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            text-align: left;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .admin-nav-btn:hover, .admin-nav-btn.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-color);
        }
        .admin-content {
            flex: 1;
            padding: 40px;
            background: var(--bg-color);
            overflow-y: auto;
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }
        input[type="text"], textarea, password {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 120px; }
        button.btn-primary {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button.btn-primary:hover { opacity: 0.9; }
        .status-msg {
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- VISTA PUBLICA -->
    <div id="public-view">
        <header>
            <h1 id="site-title">Cargando portafolio...</h1>
            <a href="#admin" style="color: var(--accent-color); text-decoration: none; font-size: 0.9rem;">⚙️ Admin Panel</a>
        </header>
        <main>
            <section style="margin-bottom: 40px;">
                <p id="site-bio" style="font-size: 1.1rem; line-height: 1.6; color: #ccc;"></p>
            </section>
            <section>
                <h2>Proyectos</h2>
                <div id="projects-container" class="projects-grid"></div>
            </section>
        </main>
    </div>

    <!-- VISTA ADMIN -->
    <div id="admin-view">
        <div class="admin-layout">
            <aside class="admin-sidebar">
                <h2>Panel de Control</h2>
                <button class="admin-nav-btn active" onclick="AdminUI.switchTab('config-tab')">🔑 Credenciales GitHub</button>
                <button class="admin-nav-btn" onclick="AdminUI.switchTab('content-tab')">📝 Editar Contenido</button>
                <hr style="border-color: var(--border-color); margin: 10px 0;">
                <button class="admin-nav-btn" onclick="window.location.hash = ''" style="color: #ef4444;">← Volver al Sitio</button>
            </aside>
            <main class="admin-content">
                <div id="config-tab" class="admin-tab-content">
                    <h2>Configuración de GitHub API</h2>
                    <p style="color: #888; font-size: 0.9rem; margin-bottom: 20px;">Tus credenciales se guardan localmente en tu navegador de forma segura.</p>
                    <div class="form-group">
                        <label>Token Personal (PAT con permiso repo):</label>
                        <input type="password" id="input-token" placeholder="ghp_xxxxxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>Repositorio (usuario/repo):</label>
                        <input type="text" id="input-repo" placeholder="grobdsgn/grobdsgn">
                    </div>
                    <div class="form-group">
                        <label>Rama (Branch):</label>
                        <input type="text" id="input-branch" value="main">
                    </div>
                    <button class="btn-primary" onclick="AdminUI.saveConfig()">Guardar Credenciales</button>
                    <div id="config-status" class="status-msg"></div>
                </div>

                <div id="content-tab" class="admin-tab-content" style="display: none;">
                    <h2>Editar data.json</h2>
                    <p style="color: #888; font-size: 0.9rem; margin-bottom: 20px;">Modifica directamente el archivo de datos general de tu web.</p>
                    <div class="form-group">
                        <label>Contenido JSON:</label>
                        <textarea id="json-editor"></textarea>
                    </div>
                    <button class="btn-primary" onclick="AdminUI.saveDataChanges()">Guardar y Publicar en GitHub</button>
                    <div id="save-status" class="status-msg"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const GH = {
            get token() { return localStorage.getItem('gh_token') || ''; },
            get repo() { return localStorage.getItem('gh_repo') || 'grobdsgn/grobdsgn'; },
            get branch() { return localStorage.getItem('gh_branch') || 'main'; },
            
            async api(path, options = {}) {
                if (!this.repo) {
                    alert("Error: Repositorio no configurado.");
                    throw new Error("Repositorio no configurado");
                }
                const res = await fetch(`https://api.github.com${path}`, {
                    ...options,
                    headers: { 
                        'Authorization': `Bearer ${this.token}`, 
                        'Accept': 'application/vnd.github+json', 
                        ...(options.headers || {}) 
                    }
                });
                return res;
            },

            async getFile(path) {
                const res = await this.api(`/repos/${this.repo}/contents/${path}?ref=${this.branch}`);
                if (!res.ok) throw new Error("No se pudo cargar el archivo desde GitHub");
                const data = await res.json();
                return {
                    content: JSON.parse(decodeURIComponent(escape(atob(data.content)))),
                    sha: data.sha
                };
            },

            async putFile(path, contentObj, sha, message) {
                const contentStr = btoa(unescape(encodeURIComponent(JSON.stringify(contentObj, null, 2))));
                const res = await this.api(`/repos/${this.repo}/contents/${path}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        message: message || 'Update via Admin Panel',
                        content: contentStr,
                        sha: sha,
                        branch: this.branch
                    })
                });
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.message || "Error al guardar en GitHub");
                }
                return await res.json();
            }
        };

        const App = {
            data: null,
            sha: null,

            async init() {
                window.addEventListener('hashchange', () => this.handleRoute());
                await this.loadData();
                this.handleRoute();
            },

            async loadData() {
                try {
                    const res = await fetch('data.json?t=' + Date.now());
                    if (!res.ok) throw new Error("No se encontró data.json local");
                    this.data = await res.json();
                    this.renderPublic();
                } catch (e) {
                    console.warn("Cargando datos por defecto...", e);
                    this.data = { title: "Mi Portafolio", bio: "Bienvenido a mi sitio web personal.", projects: [] };
                    this.renderPublic();
                }
            },

            renderPublic() {
                if (!this.data) return;
                document.getElementById('site-title').textContent = this.data.title || "Portafolio";
                document.getElementById('site-bio').textContent = this.data.bio || "";
                
                const container = document.getElementById('projects-container');
                container.innerHTML = '';
                if (this.data.projects && Array.isArray(this.data.projects)) {
                    this.data.projects.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'project-card';
                        card.innerHTML = `<h3>${p.title || 'Proyecto'}</h3><p>${p.description || ''}</p>`;
                        container.appendChild(card);
                    });
                }
            },

            handleRoute() {
                const isAdmin = window.location.hash === '#admin';
                document.getElementById('public-view').style.display = isAdmin ? 'none' : 'block';
                document.getElementById('admin-view').style.display = isAdmin ? 'block' : 'none';
                
                if (isAdmin) {
                    document.getElementById('input-token').value = GH.token;
                    document.getElementById('input-repo').value = GH.repo;
                    document.getElementById('input-branch').value = GH.branch;
                    if (this.data) {
                        document.getElementById('json-editor').value = JSON.stringify(this.data, null, 2);
                    }
                }
            }
        };

        const AdminUI = {
            switchTab(tabId) {
                document.querySelectorAll('.admin-tab-content').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.admin-nav-btn').forEach(el => el.classList.remove('active'));
                document.getElementById(tabId).style.display = 'block';
                event.currentTarget.classList.add('active');
            },

            saveConfig() {
                const token = document.getElementById('input-token').value.trim();
                const repo = document.getElementById('input-repo').value.trim();
                const branch = document.getElementById('input-branch').value.trim() || 'main';

                localStorage.setItem('gh_token', token);
                localStorage.setItem('gh_repo', repo);
                localStorage.setItem('gh_branch', branch);

                const status = document.getElementById('config-status');
                status.style.color = '#10b981';
                status.textContent = '¡Credenciales guardadas correctamente en el navegador!';
            },

            async saveDataChanges() {
                const status = document.getElementById('save-status');
                try {
                    status.style.color = '#3b82f6';
                    status.textContent = 'Conectando con GitHub para actualizar...';

                    let parsedData;
                    try {
                        parsedData = JSON.parse(document.getElementById('json-editor').value);
                    } catch (err) {
                        throw new Error("El formato JSON no es válido. Revisa las llaves y comillas.");
                    }

                    // Obtener SHA actual del archivo remoto
                    const remoteFile = await GH.getFile('data.json');
                    
                    // Enviar actualización
                    await GH.putFile('data.json', parsedData, remoteFile.sha, 'Actualización de data.json vía Panel Admin');

                    status.style.color = '#10b981';
                    status.textContent = '¡Cambios guardados y publicados con éxito en GitHub!';
                    
                    // Actualizar datos locales
                    App.data = parsedData;
                    App.renderPublic();
                } catch (err) {
                    status.style.color = '#ef4444';
                    status.textContent = 'Error: ' + err.message;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
